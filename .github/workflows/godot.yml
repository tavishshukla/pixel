name: godot check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  open-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: import and check project
        run: godot --headless --editor --path . --quit
      - name: boot the scene
        run: godot --headless --path . --quit-after 3
